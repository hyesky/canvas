<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="一个创易画吧创作工具" />
        <link rel="icon" href="/logo.svg" />
        <title>创易画吧</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
      <script type="module" crossorigin src="/assets/index-BcbSchFn.js?v=20261024-brand2"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-D40c9SXs.css">
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script>
            // 去除导航上的文档链接与版本号按钮（创易画吧品牌本地化）
            (function () {
                function stripAppNav() {
                    var doc = document.querySelector('a[href="https://docs.canvas.best"]');
                    if (doc) doc.remove();
                    var gh = document.querySelector('a[href="https://github.com/basketikun/infinite-canvas"]');
                    if (gh) gh.remove();
                    var version = Array.prototype.slice.call(document.querySelectorAll('button')).find(function (b) {
                        return (b.textContent || '').trim() === 'v0.20.0';
                    });
                    if (version) version.remove();
                }
                setInterval(stripAppNav, 300);
            })();
        </script>
    </body>
</html>
